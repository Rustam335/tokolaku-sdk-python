[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokolaku"
version = "1.0.0"
description = "Official Python SDK for the Tokolaku Engine API — AI bot replies, omnichannel messaging (WhatsApp/Instagram/Messenger), and webhook verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tokolaku" }]
keywords = ["tokolaku", "whatsapp", "chatbot", "sdk", "api", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tokolaku.id/developers"
Repository = "https://github.com/Rustam335/tokolaku-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/tokolaku"]
